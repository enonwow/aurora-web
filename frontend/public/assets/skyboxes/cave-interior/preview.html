<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cave Interior Skybox Preview</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #080a0d; color: #d9e3e8; font-family: system-ui, sans-serif; }

    h1 { font-size: 20px; font-weight: 650; margin: 0 0 16px; }
    figure { margin: 0 0 24px; }
    img { width: 100%; height: auto; display: block; border: 1px solid #2f3b42; background: #111820; }

  </style>
</head>
<body>
  <main>
    <h1>Cave Interior Skybox</h1>
    <figure>
      <img src="cave-interior-equirectangular-2048x1024.png" alt="Cave interior equirectangular skybox" />
      <figcaption>2:1 equirectangular panorama, 2048x1024</figcaption>
    </figure>
    <figure>
      <img src="cave-interior-cubemap-cross-preview.png" alt="Cave interior cubemap cross preview" />
      <figcaption>Cubemap cross preview: PY / NX PZ PX NZ / NY</figcaption>
    </figure>
  </main>

</html>
